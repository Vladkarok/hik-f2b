# Docker Compose / podman-compose example. Not yet tested.
#
# The image is the published one, pinned to an exact version. To update,
# change the tag, then: docker compose pull && docker compose up -d
# (see "Versions and updates" in README.md). To build the image yourself:
#   docker build -t hik-f2b -f Containerfile .
#   (or: podman build -t hik-f2b -f Containerfile .)
# and use the commented image: line below.
#
# Put next to this file:
#   hik-f2b.ini            (from hik-f2b.example.ini)
#   router-ca.crt          (cert_export_f2b-ca.crt exported from the router)
#   secrets/router         (router password, one line)
#   secrets/nvr            (NVR password, one line)
# The container runs as uid 65532, so the mounted files must be readable by
# it. hik-f2b.ini and router-ca.crt hold no secrets when password_file is
# used:  chmod 644 hik-f2b.ini router-ca.crt
# The secret files, with rootful Docker:
#   chown 65532 secrets/* && chmod 400 secrets/*
# Z relabels the files for SELinux; it has no effect where SELinux is off.

services:
  hik-f2b:
    image: ghcr.io/vladkarok/hik-f2b:0.3.0
    # image: hik-f2b:latest
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    pids_limit: 32
    volumes:
      - ./hik-f2b.ini:/etc/hik-f2b/hik-f2b.ini:ro,Z
      - ./router-ca.crt:/etc/hik-f2b/router-ca.crt:ro,Z
      - state:/var/lib/hik-f2b
      # Optional country database (country_db, see the README). Mount a
      # directory rather than the file itself: a file mount keeps showing
      # the old file after it is replaced. Then set
      # country_db = /etc/hik-f2b/country/country.mmdb
      # - ./country:/etc/hik-f2b/country:ro,Z
    secrets:
      - hik-f2b-router
      - hik-f2b-nvr

secrets:
  hik-f2b-router:
    file: ./secrets/router
  hik-f2b-nvr:
    file: ./secrets/nvr

volumes:
  state: {}
