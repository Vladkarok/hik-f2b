# Docker Compose / podman-compose example. CI starts it on Docker Compose
# with a dummy config on every push (.github/scripts/deploy-compose-check.sh);
# it has not been run with real devices, nor with podman-compose.
#
# The image is the published one, pinned to an exact version. To update,
# change the tag, then: docker compose pull && docker compose up -d
# (see "Versions and updates" in README.md). To build the image yourself:
#   docker build -t hik-f2b -f Containerfile .
#   (or: podman build -t hik-f2b -f Containerfile .)
# and use the commented image: line below.
#
# Put next to this file:
#   hik-f2b.ini            (from hik-f2b.example.ini)
#   router-ca.crt          (cert_export_f2b-ca.crt exported from the router)
#   secrets/router         (router password, one line)
#   secrets/nvr            (NVR password, one line)
#   secrets/telegram       (optional: Telegram bot token, one line)
# The container runs as uid 65532, so the mounted files must be readable by
# it. hik-f2b.ini and router-ca.crt hold no secrets when password_file is
# used:  chmod 644 hik-f2b.ini router-ca.crt
# Compose mounts each secret file as it is on the host, with its owner and
# mode. With rootful Docker, make them readable by uid 65532 only:
#   sudo chown 65532 secrets/* && sudo chmod 400 secrets/*
# Otherwise hik-f2b stops at startup with
# "cannot read /run/secrets/hik-f2b-...: permission denied".
# For Telegram, also enable the two commented-out hik-f2b-telegram entries
# below; [telegram] then has bot_token_file = /run/secrets/hik-f2b-telegram.
# Z relabels the files for SELinux; it has no effect where SELinux is off.

services:
  hik-f2b:
    image: ghcr.io/vladkarok/hik-f2b:0.5.2
    # image: hik-f2b:latest
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 32m
    pids_limit: 32
    # On a stop, hik-f2b finishes the step of the poll it is in, saves its
    # state and exits. The longest step it cannot interrupt is one ban sent
    # to a router that does not answer: the request and the lookup that may
    # follow it, 25 s each (http::DEFAULT_TIMEOUT in the source). 60 s covers
    # this and the save; the default of 10 s does not.
    stop_grace_period: 60s
    volumes:
      - ./hik-f2b.ini:/etc/hik-f2b/hik-f2b.ini:ro,Z
      - ./router-ca.crt:/etc/hik-f2b/router-ca.crt:ro,Z
      - state:/var/lib/hik-f2b
      # Optional country database (country_db, see the README). Mount a
      # directory rather than the file itself: a file mount keeps showing
      # the old file after it is replaced. Then set
      # country_db = /etc/hik-f2b/country/country.mmdb
      # - ./country:/etc/hik-f2b/country:ro,Z
    secrets:
      - hik-f2b-router
      - hik-f2b-nvr
      # Telegram bot token, for a [telegram] section with
      # bot_token_file = /run/secrets/hik-f2b-telegram:
      # - hik-f2b-telegram

secrets:
  hik-f2b-router:
    file: ./secrets/router
  hik-f2b-nvr:
    file: ./secrets/nvr
  # hik-f2b-telegram:
  #   file: ./secrets/telegram

volumes:
  state: {}
