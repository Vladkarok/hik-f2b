name: CI

on:
  push:
    # Branches only: a release tag runs these checks through release.yml.
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these checks before it publishes anything.
  workflow_call:
  schedule:
    # Re-check dependencies for newly published advisories every Monday.
    # GitHub disables scheduled workflows after 60 days without repository
    # activity; re-enable this one in the Actions tab if that happens.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  repo-checks:
    # Fast checks without Rust: the repository guard (addresses, letters that
    # only Russian uses, binary files) on the tree and on every commit of the
    # push or pull request, its self-test, and the documentation check.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # All commits and branches, to check every pushed commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Repository guard, tracked files
        run: |
          set -euo pipefail
          bash .github/scripts/repo-guard.sh
      - name: Repository guard, every commit of the push or pull request
        # The range comes from GITHUB_EVENT_NAME, GITHUB_EVENT_PATH and
        # GITHUB_SHA, which the runner sets.
        run: |
          set -euo pipefail
          bash .github/scripts/repo-guard.sh --ci-range
      - name: Repository guard, self-test
        run: |
          set -euo pipefail
          bash .github/scripts/repo-guard.sh --self-test
      - name: Documentation check
        run: |
          set -euo pipefail
          bash .github/scripts/docs-check.sh

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  test-arm64:
    # The same test suite (fake NVR, router and Telegram, the country
    # reader) on arm64 hardware. fmt and clippy run in the test job only.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      # Pinned, so that a new cargo-audit release changes nothing here
      # unannounced. Dependabot does not see this version: to update it,
      # take the newest release from https://crates.io/crates/cargo-audit,
      # change it here and check that this job passes.
      - run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - run: cargo +stable audit

  image:
    # Builds the image once, then starts it from the files in deploy/ with a
    # dummy config: the release workflow must not ship deploy files that do
    # not start. Pinned, so that the Docker, systemd and Podman versions the
    # checks run on only change on purpose.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Containerfile -t hik-f2b:ci .
      - run: docker run --rm hik-f2b:ci --version
      - name: Start it with deploy/compose.yaml
        run: bash .github/scripts/deploy-compose-check.sh hik-f2b:ci
      - name: Start it with deploy/hik-f2b.service
        run: bash .github/scripts/deploy-systemd-check.sh hik-f2b:ci
      - name: Check deploy/hik-f2b.container with Quadlet
        run: bash .github/scripts/deploy-quadlet-check.sh
